<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Pedido</title>
</head>
<body>
<h1>Registrar nuevo pedido</h1>

<form th:action="@{/pedidos}" method="post">

    <label>Cliente:</label>
    <select name="clienteId" required>
        <option th:each="cliente : ${clientes}"
                th:value="${cliente.id}"
                th:text="${cliente.nombres} + ' ' + ${cliente.apellidos}"></option>
    </select>
    <br><br>

    <label>Empleado:</label>
    <select name="empleadoId" required>
        <option th:each="empleado : ${empleados}"
                th:value="${empleado.id}"
                th:text="${empleado.nombres} + ' ' + ${empleado.apellidos}"></option>
    </select>
    <br><br>

    <label>Libro:</label>
    <select name="libroId" required>
        <option th:each="libro : ${libros}"
                th:value="${libro.id}"
                th:text="${libro.titulo} + ' - S/ ' + ${libro.precio}"></option>
    </select>
    <br><br>

    <label>Cantidad:</label>
    <input type="number" name="cantidad" min="1" value="1" required>
    <br><br>

    <button type="submit">Registrar pedido</button>
</form>

<br>
<a th:href="@{/pedidos}">Volver a la lista</a>
</body>
</html>
