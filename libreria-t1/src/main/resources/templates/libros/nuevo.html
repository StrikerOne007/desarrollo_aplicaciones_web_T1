<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Libro</title>
</head>
<body>
<h1>Registrar nuevo libro</h1>

<form th:action="@{/libros}" th:object="${libro}" method="post">

    <label>ISBN:</label>
    <input type="text" th:field="*{isbn}"/>
    <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" style="color:red"></span>
    <br><br>

    <label>Título:</label>
    <input type="text" th:field="*{titulo}"/>
    <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" style="color:red"></span>
    <br><br>

    <label>Autor:</label>
    <input type="text" th:field="*{autor}"/>
    <span th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}" style="color:red"></span>
    <br><br>

    <label>Precio:</label>
    <input type="number" step="0.01" th:field="*{precio}"/>
    <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" style="color:red"></span>
    <br><br>

    <label>Stock:</label>
    <input type="number" th:field="*{stock}"/>
    <span th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" style="color:red"></span>
    <br><br>

    <button type="submit">Registrar</button>
</form>

<br>
<a th:href="@{/libros}">Volver a la lista</a>
</body>
</html>
